{% extends 'base.html' %}
{% block title %}Delete Event{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="mb-3">Delete Event</h1>
        <p>Are you sure you want to delete "<strong>{{ event.event_name }}</strong>"?</p>
        <p class="text-danger">This action cannot be undone!</p>
        <form method="POST" action="{% url 'event_delete' event.pk %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'event_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
