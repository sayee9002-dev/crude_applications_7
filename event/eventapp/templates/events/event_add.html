{% extends 'base.html' %}
{% block title %}Add New Event{% endblock %}
{% block content %}
<h1 class="mb-4">Add New Event</h1>

<form method="POST" class="card card-body" action="/add/">
    {% csrf_token %}
    <div class="mb-3">
        <label for="id_event_name" class="form-label">Event Name</label>
        <input type="text" id="id_event_name" name="event_name" class="form-control"
               placeholder="Enter event name" required>
    </div>
    <div class="mb-3">
        <label for="id_venue" class="form-label">Venue</label>
        <input type="text" id="id_venue" name="venue" class="form-control"
                required>
            </div>
    <div class="mb-3">
        <label for="id_event_date" class="form-label">Event Date</label>
        <input type="date" id="id_event_date" name="event_date" class="form-control">
    </div>
    <div class="mb-3">
        <label for="id_organizer" class="form-label">Organizer</label>
        <input type="text" id="id_organizer" name="organizer" class="form-control"
               min="0" step="0.01" required>
    </div>
    <div class="form-check mb-3">
        <label for="id_ticket_price" class="form-check-label">Ticket Price</label>
        <input type="number" id="id_ticket_price" name="ticket_price"
               class="form-check-input" checked>
    </div>
    <div>
        <button type="submit" class="btn btn-success">Save Event</button>
        <a href="{% url 'event_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
